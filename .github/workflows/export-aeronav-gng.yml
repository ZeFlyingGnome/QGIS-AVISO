name: Export AVISO to AeroNav GNG

on:
  push:
    branches:
      - test
    paths:
      - ".exports/QGIS-geoJSON/**/*.geojson"

permissions:
  contents: write

concurrency:
  group: aviso-aeronav-gng-main
  cancel-in-progress: false

jobs:
  convert:
    name: Convert changed AVISO GeoJSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Get changed GeoJSON files
        id: changed
        shell: bash
        run: |
          git diff --name-only HEAD~1 HEAD \
            | grep '^\.exports/QGIS-geoJSON/.*\.geojson$' \
            | sort -u \
            > changed-aviso-files.txt || true

          echo "Changed AVISO GeoJSON files:"
          cat changed-aviso-files.txt || true

          if [ -s changed-aviso-files.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Convert affected airports
        if: steps.changed.outputs.has_changes == 'true'
        shell: bash
        run: |
          mapfile -t FILES < changed-aviso-files.txt

          echo "Files passed to exporter:"
          printf '%s\n' "${FILES[@]}"

          python .scripts/export_aeronav_gng.py "${FILES[@]}"

      - name: Commit generated AeroNav GNG files
        if: steps.changed.outputs.has_changes == 'true'
        shell: bash
        run: |
          echo "Generated AeroNav GNG files:"
          find .exports/AeroNav-GNG -type f -print | sort || true

          git add -A .exports/AeroNav-GNG

          echo
          echo "Staged changes:"
          git status --short -- .exports/AeroNav-GNG

          if git diff --cached --quiet -- .exports/AeroNav-GNG; then
            echo "No AeroNav GNG output changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: export AVISO for AeroNav GNG"

          git push origin HEAD:${{ github.ref_name }}
name: Validate AVISO GeoJSON

on:
  push:
    branches:
      - test
    paths:
      - ".exports/QGIS-geoJSON/**/*.geojson"

permissions:
  contents: read

jobs:
  validate:
    name: Validate AVISO GeoJSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Find changed AVISO GeoJSON files
        id: changed
        shell: bash
        run: |
          git diff --name-status HEAD^ HEAD \
            | awk '
                $2 ~ /^\.exports\/QGIS-geoJSON\/.*\.geojson$/ {
                  print
                }
              ' > changed_files.tsv

          if [[ -s changed_files.tsv ]]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify changed files
        if: steps.changed.outputs.any_changed == 'true'
        shell: bash
        run: |
          while IFS=$'\t' read -r status file; do

            if [[ "$status" == "D" ]]; then
              continue
            fi

            if [[ ! -f "$file" ]]; then
              echo "::error::Missing file: $file"
              exit 1
            fi

            if [[ -L "$file" ]]; then
              echo "::error::GeoJSON must not be a symlink: $file"
              exit 1
            fi

          done < changed_files.tsv

      - name: Validate changed airports
        id: validate
        if: steps.changed.outputs.any_changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t changed_files < <(
            cut -f2 changed_files.tsv
          )

          python .scripts/validate_aviso.py \
            "${changed_files[@]}" \
            > aviso-report.md

      - name: Create no-change report
        if: steps.changed.outputs.any_changed != 'true'
        shell: bash
        run: |
          {
            echo "## 🗺️ AVISO Ground Layout"
 